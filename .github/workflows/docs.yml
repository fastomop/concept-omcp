name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.8"
          python-version: "3.13"
      - name: Sync docs extras
        run: uv sync --frozen --extra docs
      - name: Build site
        run: uv run --frozen --no-sync zensical build --strict
      - uses: actions/configure-pages@v6
        # First run auto-enables Pages (source = GitHub Actions) so the workflow is
        # self-sufficient — no manual Settings → Pages step. Needs the `pages: write`
        # permission above (present). Works for this internal repo because the org is
        # on GitHub Enterprise (Pages is available for private/internal repos there).
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
