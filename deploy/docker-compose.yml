# concept-omcp — containerised Streamable HTTP MCP server.
#
# From the repo root, after building artifacts on the host
# (`concept-omcp build --omop <athena_dir>` into ./artifacts):
#
#   CONCEPT_OMCP_ARTIFACT_DIR=$(pwd)/artifacts docker compose -f deploy/docker-compose.yml up --build
#
# The MCP endpoint is then reachable at http://localhost:8100/mcp/.
#
# NOTE: vocabulary artifacts are NEVER baked into the image — they are mounted
# read-only from the host. The image carries code + the embedding model only.

services:
  concept-omcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: concept-omcp:local
    ports:
      - "${CONCEPT_OMCP_PORT:-8100}:8100"
    environment:
      CONCEPT_OMCP_TRANSPORT: "streamable-http"
      CONCEPT_OMCP_HOST: "0.0.0.0"
      CONCEPT_OMCP_PORT: "8100"
      CONCEPT_OMCP_ARTIFACT_DIR: "/artifacts"
      CONCEPT_OMCP_LOG_LEVEL: "${CONCEPT_OMCP_LOG_LEVEL:-INFO}"
      CONCEPT_OMCP_LOG_FORMAT: "${CONCEPT_OMCP_LOG_FORMAT:-json}"
    volumes:
      # Host-built artifacts, mounted READ-ONLY. The build fails fast if this is empty.
      - "${CONCEPT_OMCP_ARTIFACT_DIR:-./artifacts}:/artifacts:ro"
      # Persist the embedding-model download across restarts (first query fetches it).
      - "concept-omcp-hf-cache:/home/appuser/.cache/huggingface"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c 'import socket; socket.create_connection((\"127.0.0.1\", 8100), 3).close()'"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  concept-omcp-hf-cache:
