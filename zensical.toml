[project]
site_name = "concept-omcp Documentation"
site_description = "Semantic, relationship-aware OMOP concept search over the Model Context Protocol"
site_url = "https://fastomop.github.io/concept-omcp/"
repo_name = "fastomop/concept-omcp"
repo_url = "https://github.com/fastomop/concept-omcp"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; concept-omcp contributors"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Architecture" = "architecture.md" },
  { "Guides" = [
      { "Initialisation" = "initialisation.md" },
      { "MCP server" = "mcp.md" },
      { "In-process library" = "library.md" },
      { "Logging" = "logging.md" },
  ] },
  { "Reference" = [
      { "Build provenance" = "build_provenance.md" },
      { "Provenance & licensing" = "licensing.md" },
  ] },
]

[project.theme]
variant = "classic"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.indexes",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.action.edit",
  "content.tabs.link",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/fastomop/concept-omcp"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/concept-omcp/"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
